name: SafeWalk - deploy to isolated Convex test environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    name: Deploy SafeWalk code to fortunate-opossum-719 only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout original SafeWalk project
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify scoped DEVELOPMENT deployment key
        shell: bash
        run: |
          if [[ -z "${CONVEX_DEPLOY_KEY:-}" ]]; then
            echo "::error::Add CONVEX_DEPLOY_KEY to the ORIGINAL safewalk repository's Actions secrets, not Safewalk-Next."
            exit 1
          fi
          if [[ "$CONVEX_DEPLOY_KEY" != "dev:fortunate-opossum-719|"* ]]; then
            echo "::error::Wrong Convex deployment key. This workflow ONLY permits development deployment fortunate-opossum-719."
            exit 1
          fi

      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund

      - name: Deploy SafeWalk Convex functions into isolated test environment
        run: npx convex dev --once

      - name: Deployment instruction
        if: success()
        run: |
          echo "Convex dev deploy command succeeded."
          echo "Verify auth, function permissions, delivery and test-mode behavior in the Convex dashboard."
          echo "No app build or production deployment was performed."
